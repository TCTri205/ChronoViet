services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./media:/app/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: &default-logging
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_DB: chronoviet_db
      POSTGRES_USER: chronoviet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-${DB_PASSWORD:-chronoviet_secret}}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronoviet -d chronoviet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1500M
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 768mb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 768M
    logging: *default-logging

  vieneu-tts-service:
    build:
      context: .
      dockerfile: services/vieneu-tts/Dockerfile
    container_name: vieneu_tts_engine
    restart: always
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - TTS_SERVICE_PORT=8080
      - MEDIA_DIR=/app/media
      - AUDIO_CACHE_DIR=/app/media/audio-cache
      - WEB_CONCURRENCY=2
    ports:
      - "8080:8080"
    volumes:
      - ./media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2000M
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: always
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - DATABASE_URL=postgres://chronoviet:${POSTGRES_PASSWORD:-${DB_PASSWORD:-chronoviet_secret}}@postgres:5432/chronoviet_db
      - REDIS_URL=redis://redis:6379
      - VIENEU_PYTHON_URL=http://vieneu-tts-service:8080
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGNES_API_KEYS=${AGNES_API_KEYS}
      - AGNES_API_KEY=${AGNES_API_KEY}
      - TAVILY_API_KEYS=${TAVILY_API_KEYS}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SERPAPI_API_KEYS=${SERPAPI_API_KEYS}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - BRAVE_API_KEYS=${BRAVE_API_KEYS}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEYS=${OPENROUTER_API_KEYS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VLM_PROVIDER=${VLM_PROVIDER:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vieneu-tts-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./media:/app/media
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 2000M
    logging: *default-logging

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    shm_size: '2gb'
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4000M
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - CONCURRENCY=1
      - RENDER_CONCURRENCY=1
      - WORKER_PROBE_PORT=3001
      - DATABASE_URL=postgres://chronoviet:${POSTGRES_PASSWORD:-${DB_PASSWORD:-chronoviet_secret}}@postgres:5432/chronoviet_db
      - REDIS_URL=redis://redis:6379
      - VIENEU_PYTHON_URL=http://vieneu-tts-service:8080
      - GEMINI_API_KEYS=${GEMINI_API_KEYS}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGNES_API_KEYS=${AGNES_API_KEYS}
      - AGNES_API_KEY=${AGNES_API_KEY}
      - TAVILY_API_KEYS=${TAVILY_API_KEYS}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - SERPAPI_API_KEYS=${SERPAPI_API_KEYS}
      - SERPAPI_API_KEY=${SERPAPI_API_KEY}
      - BRAVE_API_KEYS=${BRAVE_API_KEYS}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - OPENAI_API_KEYS=${OPENAI_API_KEYS}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEYS=${OPENROUTER_API_KEYS}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - VLM_PROVIDER=${VLM_PROVIDER:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vieneu-tts-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    volumes:
      - ./media:/app/media
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
