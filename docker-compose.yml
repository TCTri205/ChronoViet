version: '3.8'

services:
  caddy:
    image: caddy:2-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./media:/app/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  postgres:
    image: pgvector/pgvector:pg15
    restart: always
    environment:
      POSTGRES_DB: chronoviet_db
      POSTGRES_USER: chronoviet
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chronoviet_secret}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chronoviet -d chronoviet_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  vieneu-tts-service:
    build:
      context: .
      dockerfile: services/vieneu-tts/Dockerfile
    container_name: vieneu_tts_engine
    restart: always
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - TTS_SERVICE_PORT=8080
      - MEDIA_DIR=/app/media
      - AUDIO_CACHE_DIR=/app/media/audio-cache
    ports:
      - "8080:8080"
    volumes:
      - ./media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    restart: always
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - DATABASE_URL=postgres://chronoviet:${DB_PASSWORD:-chronoviet_secret}@postgres:5432/chronoviet_db
      - REDIS_URL=redis://redis:6379
      - VIENEU_PYTHON_URL=http://vieneu-tts-service:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGNES_API_KEY=${AGNES_API_KEY}
      - VLM_PROVIDER=${VLM_PROVIDER:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vieneu-tts-service:
        condition: service_healthy
    volumes:
      - ./media:/app/media

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.00'
          memory: 4000M
    environment:
      - NODE_ENV=production
      - LOG_FORMAT=json
      - CONCURRENCY=1
      - RENDER_CONCURRENCY=1
      - DATABASE_URL=postgres://chronoviet:${DB_PASSWORD:-chronoviet_secret}@postgres:5432/chronoviet_db
      - REDIS_URL=redis://redis:6379
      - VIENEU_PYTHON_URL=http://vieneu-tts-service:8080
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - AGNES_API_KEY=${AGNES_API_KEY}
      - VLM_PROVIDER=${VLM_PROVIDER:-auto}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vieneu-tts-service:
        condition: service_healthy
    volumes:
      - ./media:/app/media

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
