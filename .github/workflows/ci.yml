name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '10.6.2'
  # Empty values are intentional — schemas default gracefully (see packages/shared-spec/src/config.ts)
  DATABASE_URL: ''
  NODE_ENV: test

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm --filter './packages/*' build
      - name: Lint (recursive)
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm --filter './packages/*' build
      - name: Typecheck (recursive)
        run: pnpm typecheck
      - name: Typecheck extras (eval & scripts)
        run: pnpm typecheck:extras

  unit-tests:
    name: Unit Tests (src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm --filter './packages/*' build
      - name: Run unit tests (recursive src/)
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build monorepo (recursive)
        run: pnpm build

  docker-build:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [lint, typecheck, build]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Verify App Docker Build (with GHA cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.app
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify Worker Docker Build (with GHA cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.worker
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify TTS Docker Build (with GHA cache)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: services/vieneu-tts/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: pnpm audit (high+)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  integration:
    name: Integration (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-tests, build]
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB: chronoviet_db
          POSTGRES_USER: chronoviet
          POSTGRES_PASSWORD: ${{ secrets.CI_DB_PASSWORD || 'chronoviet_secret' }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chronoviet -d chronoviet_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://chronoviet:${{ secrets.CI_DB_PASSWORD || 'chronoviet_secret' }}@localhost:5432/chronoviet_db
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Build internal packages
        run: pnpm --filter './packages/*' build
      - name: Initialize database schema
        run: pnpm db:init
      - name: Verify database health & integrity
        run: pnpm exec tsx scripts/verify-db-health.ts
