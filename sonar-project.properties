# SonarCloud / SonarQube Project Configuration for ChronoViet
# Documentation: https://docs.sonarcloud.io/advanced-setup/analysis-parameters/

# Project identification (Update if your SonarCloud organization/projectKey differs)
sonar.projectKey=TCTri205_ChronoViet
sonar.organization=tctri205
sonar.projectName=ChronoViet

# Source & test directories across Monorepo
sonar.sources=packages,apps
sonar.tests=packages,apps
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Inclusions and Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/eval/**,**/media/**,**/.next/**,**/public/**,scripts/**,services/**,**/*.d.ts,**/*.map,**/*.json
sonar.coverage.exclusions=**/eval/**,scripts/**,**/node_modules/**,**/dist/**,**/*.config.ts,**/*.d.ts

# Source encoding
sonar.sourceEncoding=UTF-8

# Test Coverage report paths (Vitest LCOV format)
sonar.javascript.lcov.reportPaths=coverage/lcov.info,packages/*/coverage/lcov.info,apps/*/coverage/lcov.info
